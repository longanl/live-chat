server {
    listen 80;
    server_name _;

    client_max_body_size 200m;   # 与后端 multipart 一致
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 REST：/api/xxx -> backend:8080/xxx ----------
    location /api/ {
        proxy_pass http://backend:8080/;   # 末尾 / 会剥掉 /api 前缀
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- STOMP over WebSocket ----------
    location /ws {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---------- 图床：直接读共享 volume ----------
    location /files/ {
        alias /var/www/pic_bed/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # 禁止上传目录沦为 Web 执行入口
    location ~* \.(php|php\d|jsp|jspx|asp|aspx|py|rb|sh|bash|pl|cgi|exe|dll|bat|cmd)$ {
        deny all;
    }
}