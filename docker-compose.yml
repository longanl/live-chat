services:
  web:
    image: ghcr.io/longanl/live-chat-frontend:${TAG:-latest}
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 96m
    volumes:
      - pic-bed:/var/www/pic_bed:ro
    networks: [app]

  backend:
    image: ghcr.io/longanl/live-chat-backend:${TAG:-latest}
    build: ./backend
    restart: unless-stopped
    mem_limit: 640m
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: live_chat
      MYSQL_USERNAME: livechat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_TOKEN_NAME: token
      JWT_SECRET: ${JWT_SECRET}
      UPLOAD_PATH: /var/www/pic_bed
      UPLOAD_DOMAIN: http://你的服务器IP或域名/files/
      SPRINGDOC_API_DOCS_PATH: /api-docs
      SPRINGDOC_SWAGGER_UI_PATH: /docs
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+UseSerialGC
        -XX:+ExitOnOutOfMemoryError
        -Duser.timezone=Asia/Shanghai
    volumes:
      - pic-bed:/var/www/pic_bed
    networks: [app]
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 256m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: livechat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: live_chat
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/src/main/resources/chat.sql:/docker-entrypoint-initdb.d/chat.sql:ro
    # 仅本地监听，不暴露公网
    ports:
      - "127.0.0.1:3306:3306"
    networks: [app]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  pic-bed:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/live-chat/pic_bed
  mysql-data:

networks:
  app: