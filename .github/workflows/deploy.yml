name: Deploy to ghcr.io
on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - run: docker build -t ghcr.io/yourname/live-chat-${{ matrix.service }}:latest ./${{ matrix.service }}
      - run: docker push ghcr.io/yourname/live-chat-${{ matrix.service }}:latest
